[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longwave-viewer"
version = "0.1.0"
description = "Minimal self-hosted long-horizon market baseline viewer"
requires-python = ">=3.11"
dependencies = ["Flask>=3.0,<4", "gunicorn>=23,<24"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
packages = ["longwave"]
